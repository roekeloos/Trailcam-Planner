name: trailcam-planner
services:
  trailcam:
    build: .
    image: trailcam-planner:${RELEASE:-local}
    environment:
      PUBLIC_ORIGIN: https://trailcam-planner.darlingdev.dev
      DATABASE_PATH: /data/presets.sqlite3
    volumes:
      - presets:/data
    networks:
      hyto:
        aliases: [trailcam-planner]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  hyto:
    external: true
    name: hyto_default
volumes:
  presets:
